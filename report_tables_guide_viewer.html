<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Tables JSON Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background:#f7f7fb; color:#1f2937; }
    h1 { margin-bottom: 8px; }
    .muted { color:#6b7280; margin-bottom:16px; }
    .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:20px; }
    button, input[type="file"] { padding:8px 12px; border:1px solid #d1d5db; border-radius:8px; background:white; }
    .card { background:white; border:1px solid #e5e7eb; border-radius:12px; padding:16px; margin-bottom:18px; }
    .meta { font-size:14px; color:#4b5563; margin-bottom:10px; }
    table { border-collapse: collapse; width: 100%; margin-top:10px; font-size:14px; }
    th, td { border:1px solid #d1d5db; padding:8px; text-align:left; vertical-align:top; }
    th { background:#f3f4f6; }
    code { background:#eef2ff; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>Report Tables Viewer</h1>
  <p class="muted">Render <code>report_tables_guide.json</code> into clean tables.</p>

  <div class="controls">
    <button id="loadDefault">Load report_tables_guide.json</button>
    <input id="fileInput" type="file" accept=".json" />
  </div>

  <div id="status" class="muted">Choose an option above.</div>
  <div id="root"></div>

  <script>
    const root = document.getElementById("root");
    const statusEl = document.getElementById("status");

    function clearUI() {
      root.innerHTML = "";
    }

    function render(data) {
      clearUI();
      if (!data || !Array.isArray(data.tables)) {
        statusEl.textContent = "Invalid JSON format. Expected { tables: [...] }.";
        return;
      }

      statusEl.textContent = `Loaded ${data.tables.length} table definitions.`;

      data.tables.forEach((tbl) => {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = `${tbl.table_id}: ${tbl.title}`;
        card.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `Add in section: <code>${tbl.add_in_section || "N/A"}</code>`;
        card.appendChild(meta);

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        (tbl.columns || []).forEach((col) => {
          const th = document.createElement("th");
          th.textContent = col;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        (tbl.rows || []).forEach((row) => {
          const tr = document.createElement("tr");
          row.forEach((cell) => {
            const td = document.createElement("td");
            td.textContent = cell;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        card.appendChild(table);
        root.appendChild(card);
      });
    }

    async function loadDefaultJSON() {
      try {
        const res = await fetch("./report_tables_guide.json");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
      } catch (err) {
        statusEl.textContent = "Could not auto-load JSON (if opened directly as file, use the file picker).";
      }
    }

    document.getElementById("loadDefault").addEventListener("click", loadDefaultJSON);

    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = JSON.parse(evt.target.result);
          render(data);
        } catch {
          statusEl.textContent = "Selected file is not valid JSON.";
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
